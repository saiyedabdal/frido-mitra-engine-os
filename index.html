<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Frido Mitra — Engine OS</title>
<meta name="description" content="Affiliate engine command dashboard for Frido Mitra: 9 macro engines across every affiliate channel.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Instrument+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#101319; --panel:#171B23; --panel2:#1D222C; --line:rgba(148,163,184,.14);
  --text:#E7EAF0; --muted:#8B94A7; --faint:#5B6373;
  --saffron:#F0A231; --jade:#34C388; --sky:#5AA7F0; --ember:#E5544B; --slate:#3A4150;
  --mono:'IBM Plex Mono',ui-monospace,monospace;
  --sans:'Instrument Sans',system-ui,sans-serif;
  --disp:'Bricolage Grotesque',var(--sans);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--ink);color:var(--text);font-family:var(--sans);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
a{color:inherit}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--saffron);outline-offset:2px;border-radius:4px}

/* header */
header{position:sticky;top:0;z-index:50;background:rgba(16,19,25,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.hwrap{max-width:1240px;margin:0 auto;padding:14px 24px;display:flex;align-items:center;gap:24px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;gap:2px;min-width:180px}
.eyebrow{font-family:var(--mono);font-size:10.5px;letter-spacing:.18em;color:var(--saffron)}
.brand h1{font-family:var(--disp);font-weight:700;font-size:22px;letter-spacing:.01em;line-height:1}
nav{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
nav button{padding:7px 14px;border-radius:8px;font-size:13.5px;font-weight:500;color:var(--muted);border:1px solid transparent}
nav button:hover{color:var(--text);background:var(--panel)}
nav button.on{color:var(--ink);background:var(--saffron);font-weight:600}
.ver{font-family:var(--mono);font-size:11px;color:var(--faint);border:1px solid var(--line);border-radius:999px;padding:3px 10px}

main{max-width:1240px;margin:0 auto;padding:28px 24px 80px}
.view{display:none}
.view.on{display:block;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

h2{font-family:var(--disp);font-weight:600;font-size:26px;margin-bottom:4px}
.sub{color:var(--muted);font-size:14px;margin-bottom:22px}
.sect{font-family:var(--mono);font-size:11px;letter-spacing:.16em;color:var(--faint);margin:30px 0 12px;text-transform:uppercase}

/* kpis */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:8px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.kpi .n{font-family:var(--disp);font-weight:700;font-size:26px;line-height:1.1}
.kpi .l{font-size:12px;color:var(--muted);margin-top:2px}
.kpi.mark .n{font-size:15px;font-family:var(--mono);font-weight:500;line-height:1.5}

/* engine lines (signature) */
.lines{border:1px solid var(--line);border-radius:14px;background:var(--panel);padding:6px 0;overflow-x:auto}
.linehead,.linerow{display:grid;grid-template-columns:210px repeat(9,minmax(52px,1fr));align-items:center;gap:0;min-width:760px;padding:0 14px}
.linehead{padding-top:10px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.linehead .eh{font-family:var(--mono);font-size:10.5px;color:var(--faint);text-align:center;letter-spacing:.08em}
.linerow{padding-top:9px;padding-bottom:9px;border-bottom:1px solid rgba(148,163,184,.06)}
.linerow:last-child{border-bottom:0}
.chname{display:flex;flex-direction:column;gap:1px;padding-right:12px}
.chname .c{font-family:var(--mono);font-size:11px;color:var(--saffron)}
.chname .c.g{color:var(--sky)}
.chname .n{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stcell{display:flex;justify-content:center;position:relative}
.stcell::before{content:'';position:absolute;left:0;right:0;top:50%;height:1px;background:var(--line);z-index:0}
.linerow .stcell:first-of-type::before{left:50%}
.linerow .stcell:last-of-type::before{right:50%}
.station{position:relative;z-index:1;width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:11.5px;border:1px solid var(--line);background:var(--panel2);color:var(--faint);transition:transform .12s ease}
.station:hover{transform:scale(1.14)}
.station.empty{border-style:dashed;background:transparent}
.station.s0{background:var(--slate);color:#C6CCD8;border-color:transparent}
.station.s1{background:var(--saffron);color:#3A2504;border-color:transparent}
.station.s2{background:var(--sky);color:#082A4A;border-color:transparent}
.station.s3{background:var(--jade);color:#053622;border-color:transparent}
.station .liv{position:absolute;top:-3px;right:-3px;width:8px;height:8px;border-radius:50%;background:var(--jade);border:2px solid var(--panel)}
.station .gdot{position:absolute;bottom:-7px;left:50%;transform:translateX(-50%);width:4px;height:4px;border-radius:50%;background:var(--sky);opacity:.8}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
.station.anim{animation:pop .3s ease backwards}

/* legend */
.legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:10px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:12px;height:12px;border-radius:4px;display:inline-block}

/* chips + tags */
.chip{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:11px;padding:3px 9px;border-radius:999px;border:1px solid transparent;white-space:nowrap}
.chip.st0{background:var(--slate);color:#C6CCD8}
.chip.st1{background:rgba(240,162,49,.16);color:var(--saffron);border-color:rgba(240,162,49,.4)}
.chip.st2{background:rgba(90,167,240,.14);color:var(--sky);border-color:rgba(90,167,240,.4)}
.chip.st3{background:rgba(52,195,136,.14);color:var(--jade);border-color:rgba(52,195,136,.45)}
.chip.click{cursor:pointer}
.chip.click:hover{filter:brightness(1.2)}
.chip .ldot{width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.9}
.tag{font-family:var(--mono);font-size:10px;letter-spacing:.06em;padding:2px 7px;border-radius:5px}
.tag.v0{background:rgba(90,167,240,.12);color:var(--sky)}
.tag.draft{background:rgba(240,162,49,.12);color:var(--saffron)}
.tag.glob{background:rgba(90,167,240,.1);color:var(--sky);border:1px dashed rgba(90,167,240,.4)}
.sev{font-family:var(--mono);font-size:10.5px;padding:2px 8px;border-radius:5px}
.sev.Blocker{background:rgba(229,84,75,.16);color:var(--ember)}
.sev.Risk{background:rgba(240,162,49,.14);color:var(--saffron)}
.sev.Watch{background:rgba(139,148,167,.14);color:var(--muted)}

/* tables */
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:10px 12px;border-bottom:1px solid rgba(148,163,184,.07);vertical-align:top}
.tbl tr:hover td{background:rgba(148,163,184,.04)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.scroll{overflow-x:auto}
.mono{font-family:var(--mono)}
.mut{color:var(--muted)}.fnt{color:var(--faint)}
.indent1{padding-left:22px}.indent2{padding-left:44px}

/* selector chips */
.selrow{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
.selrow button{font-family:var(--mono);font-size:12px;padding:6px 12px;border-radius:8px;border:1px solid var(--line);color:var(--muted);background:var(--panel)}
.selrow button:hover{color:var(--text)}
.selrow button.on{background:var(--saffron);color:var(--ink);border-color:var(--saffron);font-weight:500}
.selrow button.gsel.on{background:var(--sky)}

/* cockpit */
.eng{background:var(--panel);border:1px solid var(--line);border-radius:14px;margin-bottom:14px;overflow:hidden}
.eng>.eh2{display:flex;align-items:baseline;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--panel2)}
.eng>.eh2 .eid{font-family:var(--mono);font-size:12px;color:var(--saffron)}
.eng>.eh2 .enm{font-family:var(--disp);font-weight:600;font-size:16px}
.eng>.eh2 .ecnt{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--faint)}
.step{display:grid;grid-template-columns:34px 1fr auto;gap:4px 14px;padding:12px 16px;border-bottom:1px solid rgba(148,163,184,.06)}
.step:last-child{border-bottom:0}
.step .sq{font-family:var(--mono);font-size:11px;color:var(--faint);padding-top:2px}
.step .nm{font-weight:500}
.step .meta{grid-column:2;display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:2px}
.step .meta b{color:var(--text);font-weight:500}
.step .stop{grid-column:2;margin-top:4px;font-size:12.5px;color:var(--ember);display:flex;gap:8px;align-items:center}
.step .right{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.gap{padding:14px 16px;color:var(--faint);font-size:13px}
.gap b{color:var(--saffron);font-weight:500}

/* lens */
.lensrow{display:grid;grid-template-columns:200px 1fr 60px;gap:14px;align-items:center;padding:10px 16px;border-bottom:1px solid rgba(148,163,184,.07)}
.lensrow:last-child{border-bottom:0}
.bar{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--panel2);min-width:120px}
.bar i{display:block;height:100%}
.covergap{border:1px solid rgba(229,84,75,.35);background:rgba(229,84,75,.07);border-radius:12px;padding:12px 16px;font-size:13.5px;margin-bottom:16px}
.coverok{border:1px solid rgba(52,195,136,.3);background:rgba(52,195,136,.06);border-radius:12px;padding:12px 16px;font-size:13.5px;margin-bottom:16px;color:var(--jade)}

/* accordions — affiliate channels */
.acc{background:var(--panel);border:1px solid var(--line);border-radius:14px;margin-bottom:12px;overflow:hidden}
.acc-head{display:flex;align-items:center;gap:10px;padding-right:12px;background:var(--panel2)}
.acc-head .hmain{flex:1;min-width:0;display:flex;align-items:center;gap:12px;padding:13px 0 13px 16px;text-align:left}
.chev{font-size:11px;color:var(--faint);transition:transform .15s ease;flex:none}
.acc.open>.acc-head .chev{transform:rotate(90deg)}
.acc-head .code{font-family:var(--mono);font-size:12px;color:var(--saffron);flex:none}
.acc-head .code.g{color:var(--sky)}
.acc-head .anm{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acc-head .astat{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--faint);white-space:nowrap;flex:none}
.acc-body{display:none;border-top:1px solid var(--line)}
.acc.open>.acc-body{display:block}
.sacblock{margin:10px 0 12px 26px;border-left:2px solid rgba(148,163,184,.18)}
.sac{background:transparent;border:0;border-radius:0;margin-bottom:0}
.sac>.acc-head{background:transparent}
.sac>.acc-head .hmain{padding:10px 0 10px 14px}
.sac>.acc-body{border-top:1px dashed var(--line)}
.sengine{display:flex;gap:8px;align-items:baseline;padding:12px 16px 2px;font-size:12.5px;color:var(--muted)}
.sengine .eid{font-family:var(--mono);font-size:11px;color:var(--saffron)}
.tag.ac{background:rgba(240,162,49,.12);color:var(--saffron)}
.tag.sac{background:rgba(148,163,184,.12);color:var(--muted)}
.tag.custom{background:rgba(139,148,167,.15);color:var(--muted)}
.delx{color:var(--faint);font-size:15px;line-height:1;padding:4px 8px;border-radius:6px;flex:none}
.delx:hover{color:var(--ember);background:rgba(229,84,75,.12)}
.addbtn{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);border:1px dashed var(--line);border-radius:10px;padding:8px 14px}
.addbtn:hover{color:var(--text);border-color:var(--saffron)}
.addbtn.sm{font-size:12px;padding:6px 12px;margin:10px 16px 14px}
.addform{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:12px 16px;background:rgba(148,163,184,.04);border-radius:12px;border:1px dashed var(--line);margin-bottom:16px}
.acc .addform{border:0;border-top:1px dashed var(--line);border-radius:0;margin-bottom:0}
.addform input{background:var(--ink);border:1px solid var(--line);border-radius:8px;padding:7px 10px;color:var(--text);font-size:13px;min-width:210px}
.addform input.code{min-width:110px;font-family:var(--mono);text-transform:uppercase}
.addform .go{background:var(--saffron);color:var(--ink);border-radius:8px;padding:7px 14px;font-weight:600;font-size:13px}
.addform .err{color:var(--ember);font-size:12px}

/* analytics matrix */
.mtx td{padding:0;border-bottom:1px solid rgba(148,163,184,.07)}
.mtx td.chcell{padding:9px 12px}
.mtx .cellb{display:block;width:100%;padding:9px 6px;font-family:var(--mono);font-size:12px;text-align:center;color:var(--text)}
.mtx .cellb:hover{box-shadow:inset 0 0 0 1px var(--line)}
.mtx tfoot td{border-top:1px solid var(--line);border-bottom:0;font-family:var(--mono);font-size:11.5px;color:var(--muted);padding:9px 6px;text-align:center}
.mtx tfoot td:first-child{text-align:left;padding-left:12px}

/* engine analysis */
.fbar{padding:12px 14px;margin-bottom:16px}
.fbar-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.fbar-top .fl{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;color:var(--faint)}
.modetog{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-left:auto}
.modetog button{padding:5px 12px;font-size:12px;color:var(--muted)}
.modetog button.on{background:var(--sky);color:var(--ink);font-weight:600}
.fchips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.fchip{font-family:var(--mono);font-size:11.5px;padding:5px 10px;border-radius:7px;border:1px solid var(--line);color:var(--muted);background:var(--panel2)}
.fchip:hover{color:var(--text)}
.fchip.on{background:var(--saffron);color:var(--ink);border-color:var(--saffron);font-weight:500}
.fchip.g.on{background:var(--sky);border-color:var(--sky)}
.fchip.part{background:rgba(240,162,49,.16);color:var(--saffron);border-color:rgba(240,162,49,.5)}
.fchip.acp{font-weight:600}
.fdiv{width:1px;height:18px;background:var(--line);margin:0 3px;flex:none}
.fsub{color:var(--faint);font-size:10px}
.eng .engbody{display:none}
.eng.open .engbody{display:block}
.eng.open>.eh2 .chev{transform:rotate(90deg)}
.eh2but{width:100%;text-align:left;cursor:pointer;align-items:center}
.eh2but:hover{background:rgba(148,163,184,.08)}
.purp{padding:12px 16px 0;font-size:12.5px;color:var(--muted)}
.combar{display:flex;align-items:center;gap:12px;padding:12px 16px;flex-wrap:wrap}
.subch{display:flex;align-items:center;gap:10px;padding:9px 16px;background:rgba(148,163,184,.05);border-top:1px solid var(--line);font-size:12.5px;flex-wrap:wrap}
.subch .code{font-family:var(--mono);font-size:11px;color:var(--saffron)}
.subch .code.g{color:var(--sky)}
.subch .cnt{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--faint)}
.xall{font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:8px;padding:4px 10px}
.xall:hover{color:var(--text)}
@media(max-width:720px){
  .acc-head .astat{display:none}
  .eh2but .ecnt{display:none}
  .eh2but .bar{display:none}
}

/* stopper feed */
.feed .step{grid-template-columns:1fr auto}
footer{border-top:1px solid var(--line);margin-top:40px;padding:20px 24px;max-width:1240px;margin-left:auto;margin-right:auto;font-size:12px;color:var(--faint);display:flex;gap:18px;flex-wrap:wrap;align-items:center}
footer button{color:var(--muted);border:1px solid var(--line);border-radius:8px;padding:5px 12px;font-size:12px}
footer button:hover{color:var(--text)}
@media(max-width:720px){
  .hwrap{padding:12px 16px;gap:12px}
  main{padding:20px 14px 60px}
  .linehead,.linerow{grid-template-columns:150px repeat(9,minmax(40px,1fr))}
  .station{width:24px;height:24px;font-size:10px;border-radius:6px}
  .lensrow{grid-template-columns:1fr;gap:8px}
}
</style>
</head>
<body>
<header>
  <div class="hwrap">
    <div class="brand">
      <span class="eyebrow">FRIDO MITRA · AFFILIATE PROGRAM</span>
      <h1>Engine OS</h1>
    </div>
    <nav id="nav" aria-label="Sections">
      <button data-v="analytics">Analytics</button>
      <button data-v="channels">Affiliate Channels</button>
      <button data-v="engines">Engine Analysis</button>
    </nav>
    <span class="ver">v1.1 · sections</span>
  </div>
</header>

<main>
  <section class="view" id="v-analytics"></section>
  <section class="view" id="v-channels"></section>
  <section class="view" id="v-engines"></section>
</main>

<footer>
  <span>System of record: Google Sheet (Engine OS design §2). This build: embedded seed v1 — rows tagged <span class="tag v0">V0</span> come from the master sheet; <span class="tag draft">DRAFT</span> rows need Sprint-1 confirmation.</span>
  <span>Status clicks and added channels are saved in this browser only.</span>
  <button id="resetBtn">Reset local status edits</button>
  <button id="resetChBtn">Remove added channels</button>
</footer>

<script>
/* ---------------- data ---------------- */
const STATUSES = ["Not started","In build","Testable","Live"];

const ENGINES = [
 {id:"E1",name:"Acquiring Affiliates",purpose:"Bring new affiliates into the funnel, organic + performance"},
 {id:"E2",name:"Onboarding Affiliates",purpose:"RR application, approval, AM + category, access and trial"},
 {id:"E3",name:"Engaging Affiliates",purpose:"Comms, hooks, trends and schemes that keep affiliates active"},
 {id:"E4",name:"Publishing Content",purpose:"Affiliate-wise content tracking and CTA mechanics"},
 {id:"E5",name:"PDP & CRO Engine",purpose:"Landing vs PDP testing plus aided-sales capture"},
 {id:"E6",name:"Sales Engine",purpose:"Live channel-wise sales orchestration"},
 {id:"E7",name:"Profitability Engine",purpose:"Channel-level CM2 from tagged Shopify orders"},
 {id:"E8",name:"Payout Engine",purpose:"Refer Rush payment rails for affiliate payouts"},
 {id:"E9",name:"Retention Engine",purpose:"Filter and retain proven sellers and content pushers"}
];

const CHANNELS = [
 {id:"GLOBAL",parent:null,level:"AC",name:"Global · shared platform steps",leaf:true,global:true,status:"—"},
 {id:"GT",parent:null,level:"AC",name:"GT Traders Across India",legacy:"L1",leaf:true,status:"POC pilot"},
 {id:"SP",parent:null,level:"AC",name:"Specialists & Professionals",leaf:false,status:""},
 {id:"SP-PHY",parent:"SP",level:"SAC",name:"Physiotherapists",legacy:"L2",leaf:true,status:"POC pilot"},
 {id:"SP-ORT",parent:"SP",level:"SAC",name:"Orthopedic Doctors",legacy:"L2",leaf:true,status:"Ideation"},
 {id:"SM",parent:null,level:"AC",name:"Social Media Creators",leaf:false,status:""},
 {id:"SM-IG",parent:"SM",level:"SAC",name:"Instagram",leaf:false,status:""},
 {id:"SM-IG-WL",parent:"SM-IG",level:"SSC",name:"Whitelisted Influencers",legacy:"L3",leaf:true,status:"POC pilot"},
 {id:"SM-IG-NEW",parent:"SM-IG",level:"SSC",name:"New Creators (gunsblazing)",legacy:"L4",leaf:true,status:"Ideation"},
 {id:"SM-YT",parent:"SM",level:"SAC",name:"YouTube",leaf:false,status:""},
 {id:"SM-YT-LF",parent:"SM-YT",level:"SSC",name:"Long-Form Creators",leaf:true,status:"Ideation"},
 {id:"SM-YT-SH",parent:"SM-YT",level:"SSC",name:"Shorts Creators",leaf:true,status:"Ideation"},
 {id:"ST",parent:null,level:"AC",name:"Students · Campus Ambassadors",leaf:true,status:"Ideation"},
 {id:"HH",parent:null,level:"AC",name:"Households · Word of Mouth",leaf:true,status:"Ideation"}
];

/* one row = one sub-engine for one leaf channel in one engine */
const LEDGER = [
 /* GLOBAL — from master sheet v0 */

const LSKEY="fm_gtm_v1";
let overrides={};
try{overrides=JSON.parse(localStorage.getItem(LSKEY)||"{}")}catch(e){overrides={}}
function saveOv(){try{localStorage.setItem(LSKEY,JSON.stringify(overrides))}catch(e){}}
function rowId(r){return r.ch+"-"+r.eng+"-"+String(r.seq).padStart(2,"0")}
function eff(r){return overrides[rowId(r)]||r.gtm}
function cycle(r){const i=STATUSES.indexOf(eff(r));overrides[rowId(r)]=STATUSES[(i+1)%STATUSES.length];saveOv();router()}

/* ---------------- helpers ---------------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* custom channels — browser-local additions to the seed registry */
const CHKEY="fm_channels_v1";
let CUSTOM=[];
try{CUSTOM=JSON.parse(localStorage.getItem(CHKEY)||"[]")}catch(e){CUSTOM=[]}
if(!Array.isArray(CUSTOM))CUSTOM=[];
function saveCh(){try{localStorage.setItem(CHKEY,JSON.stringify(CUSTOM))}catch(e){}}

function allCh(){
 const m=CHANNELS.concat(CUSTOM.map(c=>({...c})));
 m.forEach(c=>{if(c.custom)c.leaf=!m.some(k=>k.parent===c.id)});
 return m;
}
const chById=id=>allCh().find(c=>c.id===id);
const childrenOf=id=>allCh().filter(c=>c.parent===id);
const leafList=()=>allCh().filter(c=>c.leaf);
const realLeafList=()=>leafList().filter(c=>!c.global);
function leafUnder(id){const c=chById(id);if(!c)return[];if(c.leaf)return[c];let out=[];childrenOf(id).forEach(k=>{out=out.concat(leafUnder(k.id))});return out}
function nDesc(id){return childrenOf(id).reduce((n,k)=>n+1+nDesc(k.id),0)}
const rowsFor=(ch,eng)=>LEDGER.filter(r=>r.ch===ch&&(!eng||r.eng===eng)).sort((a,b)=>a.eng===b.eng?a.seq-b.seq:a.eng<b.eng?-1:1);
function rowsMany(ids,eng){const s=new Set(ids);return LEDGER.filter(r=>s.has(r.ch)&&(!eng||r.eng===eng)).sort((a,b)=>a.ch!==b.ch?(a.ch<b.ch?-1:1):a.eng!==b.eng?(a.eng<b.eng?-1:1):a.seq-b.seq)}
function counts(rows){const c={"Not started":0,"In build":0,"Testable":0,"Live":0};rows.forEach(r=>c[eff(r)]++);return c}
function gtmPct(rows){if(!rows.length)return 0;const c=counts(rows);return Math.round(100*(c["Live"]*3+c["Testable"]*2+c["In build"])/(3*rows.length))}
function stChipCls(s){return "st"+STATUSES.indexOf(s)}
function statChip(r){const s=eff(r);const local=overrides[rowId(r)]&&overrides[rowId(r)]!==r.gtm;
 return '<button class="chip click '+stChipCls(s)+'" data-cyc="'+rowId(r)+'" title="Click to cycle status (saved locally)">'+(local?'<span class="ldot"></span>':'')+esc(s)+'</button>'}
function srcTag(r){return '<span class="tag '+(r.src==="v0"?"v0":"draft")+'">'+(r.src==="v0"?"V0":"DRAFT")+'</span>'}
function chTag(c){return '<span class="tag '+(c.level==="AC"?"ac":"sac")+'">'+(c.level==="AC"?"AC":"SAC")+'</span>'+(c.custom?' <span class="tag custom">ADDED</span>':'')}
function barHTML(rows,w){const cc=counts(rows);const tot=rows.length||1;
 return '<span class="bar"'+(w?' style="min-width:'+w+'px;max-width:'+w+'px"':'')+' title="'+STATUSES.map(s=>s+": "+cc[s]).join(" · ")+'">'
 +'<i style="width:'+(100*cc["Live"]/tot)+'%;background:var(--jade)"></i>'
 +'<i style="width:'+(100*cc["Testable"]/tot)+'%;background:var(--sky)"></i>'
 +'<i style="width:'+(100*cc["In build"]/tot)+'%;background:var(--saffron)"></i></span>'}
function statLine(rows){const cc=counts(rows);const st=rows.filter(r=>r.stop).length;
 return rows.length+' steps · '+cc["Live"]+' live · GTM '+gtmPct(rows)+'%'+(st?' · <span style="color:var(--ember)">'+st+' stopper'+(st>1?'s':'')+'</span>':'')}
function metaLine(r){return '<div class="meta"><span><b>Owner</b> '+esc(r.owner)+'</span>'
 +(r.poc?'<span><b>POC tool</b> '+esc(r.poc)+'</span>':'')
 +(r.scaled?'<span><b>Scaled tool</b> '+esc(r.scaled)+'</span>':'')
 +(r.data?'<span><b>Data</b> '+esc(r.data)+'</span>':'')+'</div>'}
function stopLine(r){return r.stop?'<div class="stop"><span class="sev '+r.sev+'">'+r.sev+'</span>'+esc(r.stop)+'</div>':''}
const pad2=n=>String(n).padStart(2,"0");

/* ---------------- ui state ---------------- */
const openAC=new Set(),openSAC=new Set(),openENG=new Set();
let engMode="combined";
let engSel=null;            /* null = every leaf channel selected */
let metric="gtm";
let showAddAC=false,showAddSAC=null,addErr="";
function selLeaves(){const all=leafList();return engSel===null?all:all.filter(c=>engSel.has(c.id))}
function openChain(id){let cur=chById(id);while(cur&&cur.parent){const p=chById(cur.parent);if(p){if(p.parent)openSAC.add(p.id);else openAC.add(p.id)}cur=p}}
function materializeSel(){if(engSel===null)engSel=new Set(leafList().map(c=>c.id))}
function normalizeSel(){if(engSel&&engSel.size===leafList().length)engSel=null}
function toggleLeaf(id){materializeSel();if(engSel.has(id))engSel.delete(id);else engSel.add(id);normalizeSel()}
function toggleFam(id){materializeSel();const lu=leafUnder(id).map(x=>x.id);const allOn=lu.every(i=>engSel.has(i));lu.forEach(i=>{if(allOn)engSel.delete(i);else engSel.add(i)});normalizeSel()}

/* ---------------- channel add / remove ---------------- */
function sanitizeCode(s){return String(s||"").toUpperCase().replace(/[^A-Z0-9]/g,"").slice(0,6)}
function autoCode(name){
 const w=String(name).trim().split(/\s+/).filter(Boolean);
 let base=w.length>=2?w.map(x=>x[0]).join(""):String(w[0]||"").slice(0,3);
 return sanitizeCode(base)||"CH";
}
function uniqueId(id){let out=id,n=2;while(chById(out)){out=id+n;n++}return out}
function addChannel(kind,parent){
 const nmEl=$("#nm-"+kind),cdEl=$("#cd-"+kind);
 const nm=(nmEl?nmEl.value:"").trim();
 const typed=sanitizeCode(cdEl?cdEl.value:"");
 if(!nm){addErr="Give the channel a name.";router();focusAdd(kind);return}
 const code=typed||autoCode(nm);
 let id=parent?parent+"-"+code:code;
 if(typed&&chById(id)){addErr="Code "+id+" is already used — pick another.";router();focusAdd(kind);return}
 id=uniqueId(id);
 CUSTOM.push({id:id,parent:parent||null,level:parent?"SAC":"AC",name:nm,leaf:true,status:"New",custom:true});
 saveCh();
 addErr="";showAddAC=false;showAddSAC=null;
 if(parent)openChain(id);else openAC.add(id);
 router();
}
function focusAdd(kind){const el=$("#nm-"+kind);if(el)el.focus()}
function delChannel(id){
 const c=chById(id);if(!c||!c.custom)return;
 const gather=x=>{let out=[x];CUSTOM.filter(k=>k.parent===x).forEach(k=>{out=out.concat(gather(k.id))});return out};
 const doomed=new Set(gather(id));
 if(!confirm("Remove "+id+" — "+c.name+"?"+(doomed.size>1?" Its added sub-channels go too.":"")))return;
 CUSTOM=CUSTOM.filter(k=>!doomed.has(k.id));
 if(engSel)doomed.forEach(d=>engSel.delete(d));
 doomed.forEach(d=>{openAC.delete(d);openSAC.delete(d)});
 saveCh();router();
}

  +'</div><div class="acc-body">'
  +(c.leaf?stepsByEngine(c.id):'')
  +(kids.length?'<div class="sacblock">'+kids.map(renderSub).join('')+'</div>':'')
  +'</div></div>';
}
function renderAC(c){
 const isOpen=openAC.has(c.id);
 const kids=childrenOf(c.id);
 const rows=rowsMany(leafUnder(c.id).map(x=>x.id));
 const d=nDesc(c.id);
 return '<div class="acc'+(isOpen?' open':'')+'" id="ch-'+c.id+'">'
  +'<div class="acc-head"><button class="hmain" data-tglac="'+c.id+'" aria-expanded="'+isOpen+'"><span class="chev">▸</span><span class="code'+(c.global?' g':'')+'">'+c.id+'</span><span class="anm">'+esc(c.name)+'</span>'+(c.global?'<span class="tag glob">SHARED</span>':chTag(c))+'</button>'
  +'<span class="astat">'+(c.global?'':(d?d+' SAC · ':''))+statLine(rows)+'</span>'
  +(c.custom?'<button class="delx" data-del="'+c.id+'" title="Remove this added channel">×</button>':'')
  +'</div><div class="acc-body">'
  +(c.leaf?stepsByEngine(c.id):'')
  +(kids.length?'<div class="sacblock">'+kids.map(renderSub).join('')+'</div>':'')
  +(c.global?'':(showAddSAC===c.id?addFormHTML("sac",c.id):'<button class="addbtn sm" data-showaddsac="'+c.id+'">＋ Add SAC</button>'))
  +'</div></div>';
}
function vChannels(){
 let h='<h2>Affiliate channels</h2><p class="sub">The AC / SAC registry. Each affiliate channel opens into its sub-affiliate channels (indented) and their engine steps. Additions are saved in this browser.</p>';
 h+=showAddAC?addFormHTML("ac",null):'<button class="addbtn" data-showaddac style="margin-bottom:16px">＋ Add Affiliate Channel</button>';
 allCh().filter(c=>!c.parent).forEach(c=>{h+=renderAC(c)});
 $("#v-channels").innerHTML=h;
}

/* ---------------- section 3 · engine analysis ---------------- */
function famState(ids){const sel=new Set(selLeaves().map(c=>c.id));const on=ids.filter(i=>sel.has(i)).length;return on===0?"off":on===ids.length?"on":"part"}
function engStep(r,withCh){
 if(withCh)return '<div class="step" style="grid-template-columns:96px 1fr auto"><div class="mono" style="color:var(--'+(r.ch==="GLOBAL"?'sky':'saffron')+');font-size:11px;padding-top:3px">'+r.ch+'</div><div><div class="nm">'+esc(r.name)+'</div>'+metaLine(r)+stopLine(r)+'</div><div class="right">'+statChip(r)+srcTag(r)+'</div></div>';
 return '<div class="step"><div class="sq">'+pad2(r.seq)+'</div><div><div class="nm">'+esc(r.name)+'</div>'+metaLine(r)+stopLine(r)+'</div><div class="right">'+statChip(r)+srcTag(r)+'</div></div>';
}
function vEngines(){
 const sel=selLeaves();
 const selIds=sel.map(c=>c.id);
 let h='<h2>Engine analysis</h2><p class="sub">E1 → E9, each engine as its own drop-down, analysed for the affiliate channels you pick. Combine the selection into one aggregate or separate it back out per channel.</p>';
 h+='<div class="panel fbar"><div class="fbar-top"><span class="fl">AC · SAC FILTER</span>'
  +'<button class="fchip'+(engSel===null?' on':'')+'" data-fall title="Select every channel">ALL</button>'
  +'<span class="modetog" role="group" aria-label="Combine mode"><button class="'+(engMode==="combined"?'on':'')+'" data-mode="combined" title="Merge selected channels into one aggregate">Combined</button><button class="'+(engMode==="separate"?'on':'')+'" data-mode="separate" title="Break the analysis out per channel">Separated</button></span></div>';
 h+='<div class="fchips">';
 allCh().filter(c=>!c.parent).forEach((t,i)=>{
  if(i)h+='<span class="fdiv"></span>';
  if(t.leaf){
   h+='<button class="fchip'+(t.global?' g':'')+(famState([t.id])==="on"?' on':'')+'" data-fch="'+t.id+'" title="'+esc(t.name)+'">'+t.id+'</button>';
  }else{
   const lu=leafUnder(t.id).map(x=>x.id);
   const st=famState(lu);
   h+='<button class="fchip acp'+(st==="on"?' on':st==="part"?' part':'')+'" data-ffam="'+t.id+'" title="'+esc(t.name)+' — toggle the whole family">'+t.id+'</button><span class="fsub">›</span>';
   leafUnder(t.id).forEach(l=>{h+='<button class="fchip'+(famState([l.id])==="on"?' on':'')+'" data-fch="'+l.id+'" title="'+esc(l.name)+'">'+l.id+'</button>'});
  }
 });
 h+='</div></div>';
 h+='<div class="sect" style="display:flex;align-items:center;gap:8px">Engines · '+sel.length+' channel'+(sel.length!==1?'s':'')+' selected<span style="margin-left:auto;display:flex;gap:8px"><button class="xall" data-xall="open">Expand all</button><button class="xall" data-xall="close">Collapse all</button></span></div>';
 if(!sel.length)h+='<div class="panel"><div class="gap"><b>No channels selected.</b> Pick AC / SAC chips above or hit ALL.</div></div>';
 ENGINES.forEach(e=>{
  const rows=rowsMany(selIds,e.id);
  const isOpen=openENG.has(e.id);
  h+='<div class="eng'+(isOpen?' open':'')+'" id="eng-'+e.id+'">'
   +'<button class="eh2 eh2but" data-tgleng="'+e.id+'" aria-expanded="'+isOpen+'"><span class="chev">▸</span><span class="eid">'+e.id+'</span><span class="enm">'+esc(e.name)+'</span><span class="ecnt">'+(rows.length?statLine(rows):'no steps in selection')+'</span>'+barHTML(rows,120)+'</button>'
   +'<div class="engbody">'
   +'<div class="purp">'+esc(e.purpose)+'</div>';
  if(!rows.length){h+='<div class="gap"><b>Coverage gap</b> — nothing defined for '+e.id+' in the current selection.</div>'}
  else if(engMode==="combined"){
   h+='<div class="combar">'+barHTML(rows,220)+'<span class="mono fnt" style="font-size:11px">'+statLine(rows)+'</span></div>';
   rows.forEach(r=>{h+=engStep(r,true)});
  }else{
   const none=[];
   sel.forEach(c=>{
    const rs=rowsFor(c.id,e.id);
    if(!rs.length){none.push(c.id);return}
    h+='<div class="subch"><span class="code'+(c.global?' g':'')+'">'+c.id+'</span><span>'+esc(c.name)+'</span>'+barHTML(rs,120)+'<span class="cnt">'+rs.length+' steps · '+gtmPct(rs)+'%</span></div>';
    rs.forEach(r=>{h+=engStep(r,false)});
   });
   if(none.length)h+='<div class="gap">No steps here for: <span class="mono">'+none.join(", ")+'</span></div>';
  }
  h+='</div></div>';
 });
 $("#v-engines").innerHTML=h;
}

/* ---------------- router ---------------- */
let appliedHash=null;
function router(){
 let parts=(location.hash.replace(/^#\/?/,"")||"analytics").split("/");
 if(parts[0]==="dashboard")parts=["analytics"];
 if(parts[0]==="registry")parts=["channels"];
 if(parts[0]==="lens")parts=["engines",parts[1]];
 if(parts[0]==="cockpit")parts=parts[2]?["engines",parts[2],parts[1]]:["channels",parts[1]];
 const view=["analytics","channels","engines"].includes(parts[0])?parts[0]:"analytics";
 const fresh=location.hash!==appliedHash;appliedHash=location.hash;
 if(fresh&&view==="engines"){
  if(parts[1]&&ENGINES.some(e=>e.id===parts[1]))openENG.add(parts[1]);
  if(parts[2]&&chById(parts[2]))engSel=new Set(leafUnder(parts[2]).map(c=>c.id));
 }
 if(fresh&&view==="channels"&&parts[1]&&chById(parts[1])){
  openChain(parts[1]);
  const c=chById(parts[1]);
  if(c.parent)openSAC.add(c.id);else openAC.add(c.id);
 }
 document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.v===view));
 document.querySelectorAll(".view").forEach(v=>v.classList.remove("on"));
 $("#v-"+view).classList.add("on");
 if(view==="analytics")vAnalytics();
 if(view==="channels")vChannels();
 if(view==="engines")vEngines();
 if(fresh){
  let target=null;
  if(view==="engines"&&parts[1]&&ENGINES.some(e=>e.id===parts[1]))target="eng-"+parts[1];
  if(view==="channels"&&parts[1]&&chById(parts[1]))target="ch-"+parts[1];
  if(target){const el=document.getElementById(target);if(el)setTimeout(()=>el.scrollIntoView({behavior:"smooth",block:"start"}),60)}
 }
 const rb=$("#resetChBtn");if(rb)rb.style.display=CUSTOM.length?"":"none";
}
document.addEventListener("click",ev=>{
 const t=ev.target;
 const go=t.closest("[data-go]");if(go){location.hash="#/"+go.dataset.go;return}
 const nv=t.closest("nav button");if(nv){location.hash="#/"+nv.dataset.v;return}
 const cyc=t.closest("[data-cyc]");if(cyc){const r=LEDGER.find(x=>rowId(x)===cyc.dataset.cyc);if(r)cycle(r);return}
 const tac=t.closest("[data-tglac]");if(tac){const id=tac.dataset.tglac;if(openAC.has(id))openAC.delete(id);else openAC.add(id);router();return}
 const tsc=t.closest("[data-tglsac]");if(tsc){const id=tsc.dataset.tglsac;if(openSAC.has(id))openSAC.delete(id);else openSAC.add(id);router();return}
 const ten=t.closest("[data-tgleng]");if(ten){const id=ten.dataset.tgleng;if(openENG.has(id))openENG.delete(id);else openENG.add(id);router();return}
 const mt=t.closest("[data-metric]");if(mt){metric=mt.dataset.metric;router();return}
 const md=t.closest("[data-mode]");if(md){engMode=md.dataset.mode;router();return}
 if(t.closest("[data-fall]")){engSel=null;router();return}
 const fc=t.closest("[data-fch]");if(fc){toggleLeaf(fc.dataset.fch);router();return}
 const ff=t.closest("[data-ffam]");if(ff){toggleFam(ff.dataset.ffam);router();return}
 const xa=t.closest("[data-xall]");if(xa){if(xa.dataset.xall==="open")ENGINES.forEach(e=>openENG.add(e.id));else openENG.clear();router();return}
 if(t.closest("[data-showaddac]")){showAddAC=true;showAddSAC=null;addErr="";router();focusAdd("ac");return}
 const sas=t.closest("[data-showaddsac]");if(sas){showAddSAC=sas.dataset.showaddsac;showAddAC=false;addErr="";router();focusAdd("sac");return}
 if(t.closest("[data-canceladd]")){showAddAC=false;showAddSAC=null;addErr="";router();return}
 if(t.closest("[data-saveac]")){addChannel("ac",null);return}
 const svs=t.closest("[data-savesac]");if(svs){addChannel("sac",svs.dataset.savesac);return}
 const dl=t.closest("[data-del]");if(dl){delChannel(dl.dataset.del);return}
});
document.addEventListener("keydown",ev=>{
 if(ev.key!=="Enter")return;
 const id=ev.target&&ev.target.id;
 if(id==="nm-ac"||id==="cd-ac"){ev.preventDefault();addChannel("ac",null)}
 else if(id==="nm-sac"||id==="cd-sac"){ev.preventDefault();addChannel("sac",showAddSAC)}
});
$("#resetBtn").addEventListener("click",()=>{overrides={};saveOv();router()});
$("#resetChBtn").addEventListener("click",()=>{
 if(!CUSTOM.length)return;
 if(confirm("Remove all "+CUSTOM.length+" added channel(s)? Seed v0 channels stay.")){CUSTOM=[];engSel=null;saveCh();router()}
});
window.addEventListener("hashchange",router);
router();
</script>
</body>
</html>
